[project]
name = "mined-out"
version = "0.1.0"
description = ""
authors = [
    {name = "vlnn", email = "vlnn-github@proton.me"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyxel>=2.3.19,<3.0.0",
    "loguru>=0.7.0",
]

[project.scripts]
mined_out = "mined_out.main:MinedOut"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.15.1",
    "debugpy>=1.8.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mined_out"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["src"]
addopts = [
    "--verbose",
    "--tb=short",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-mock>=3.15.1",
]
